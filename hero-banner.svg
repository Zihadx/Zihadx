<svg viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nur Zihad — Software Engineer — Secure Dashboards, Auth Systems, SaaS MVPs" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090B"/>
      <stop offset="55%" stop-color="#0B0D10"/>
      <stop offset="100%" stop-color="#0D0F12"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="46%" r="65%">
      <stop offset="0%" stop-color="#111418" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0D0F12" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#08090B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64E6D3" stop-opacity="0"/>
      <stop offset="50%" stop-color="#64E6D3" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8AA4FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ruleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64E6D3" stop-opacity="0"/>
      <stop offset="50%" stop-color="#64E6D3" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#64E6D3" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="auroraTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#64E6D3" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#64E6D3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8AA4FF" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#8AA4FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5F5F0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F5F5F0" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#F5F5F0" stop-opacity="0"/>
    </linearGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="bigBlur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="320"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">

  <rect width="1200" height="320" fill="url(#bgGrad)"/>

  <!-- drifting aurora blobs, slow independent orbits -->
  <g filter="url(#bigBlur)">
    <circle cx="220" cy="90" r="140" fill="url(#auroraTeal)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 60,30; -20,50; 0,0" dur="34s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="230" r="160" fill="url(#auroraBlue)">
      <animateTransform attributeName="transform" type="translate" values="0,0; -50,-25; 25,-45; 0,0" dur="40s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="300" r="120" fill="url(#auroraTeal)" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="0,0; 40,-20; -40,-10; 0,0" dur="46s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- diagonal sheen sweep -->
  <rect x="-600" y="0" width="500" height="320" fill="url(#sheenGrad)" transform="skewX(-20)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 2400,0" dur="9s" repeatCount="indefinite" additive="sum"/>
  </rect>

  <!-- faint drafting grid, kept to the edges -->
  <g stroke="#181B20" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="90" y1="0" x2="90" y2="320"/>
    <line x1="1110" y1="0" x2="1110" y2="320"/>
  </g>

  <!-- floating dust particles -->
  <g fill="#F5F5F0">
    <circle cx="150" cy="60" r="1.4" opacity="0.5"><animate attributeName="opacity" values="0.1;0.7;0.1" dur="7s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; 0,-14; 0,0" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="260" r="1.1" opacity="0.4"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="9s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="55" r="1.3" opacity="0.5" fill="#64E6D3"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="6s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; 0,-12; 0,0" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="730" cy="270" r="1.4" opacity="0.4"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="10s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; 0,-16; 0,0" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="50" r="1.1" opacity="0.5" fill="#8AA4FF"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="8s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; 0,-10; 0,0" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="255" r="1.3" opacity="0.4"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="7.5s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; 0,-13; 0,0" dur="7.5s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="40" r="1" opacity="0.4"><animate attributeName="opacity" values="0.4;0.1;0.4" dur="11s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; 0,-9; 0,0" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="290" r="1.2" opacity="0.4" fill="#64E6D3"><animate attributeName="opacity" values="0.15;0.6;0.15" dur="8.5s" repeatCount="indefinite"/><animateTransform attributeName="transform" type="translate" values="0,0; 0,-11; 0,0" dur="8.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- peripheral geometric motif, left -->
  <g stroke="url(#lineGrad)" stroke-width="1.2" fill="none" opacity="0.8">
    <path d="M -40 250 L 90 190 L 200 235"/>
    <path d="M 90 190 L 90 130"/>
  </g>
  <circle cx="90" cy="190" r="3.2" fill="#64E6D3">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="130" r="2.4" fill="#8AA4FF">
    <animate attributeName="opacity" values="1;0.4;1" dur="6.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="200" cy="235" r="2.4" fill="#9A9EA6"/>

  <!-- peripheral geometric motif, right -->
  <g stroke="url(#lineGrad)" stroke-width="1.2" fill="none" opacity="0.8">
    <path d="M 1240 75 L 1110 130 L 1000 85"/>
    <path d="M 1110 130 L 1110 190"/>
  </g>
  <circle cx="1110" cy="130" r="3.2" fill="#64E6D3">
    <animate attributeName="opacity" values="1;0.4;1" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1110" cy="190" r="2.4" fill="#8AA4FF">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="5.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="85" r="2.4" fill="#9A9EA6"/>

  <!-- soft glow behind the type block for legibility, gently breathing -->
  <ellipse cx="600" cy="165" rx="420" ry="120" fill="url(#vignette)" filter="url(#softBlur)">
    <animate attributeName="opacity" values="0.75;1;0.75" dur="6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- eyebrow -->
  <text x="600" y="95" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" letter-spacing="6" fill="#64E6D3">SOFTWARE ENGINEER</text>

  <!-- name -->
  <text x="600" y="168" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="72" letter-spacing="6" fill="#F5F5F0">NUR ZIHAD</text>

  <!-- rule, slow shimmer -->
  <rect x="480" y="196" width="240" height="1" fill="url(#ruleGrad)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- subtitle -->
  <text x="600" y="228" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" letter-spacing="0.5" fill="#9A9EA6">Next.js &amp; React Developer — Secure Dashboards, Auth Systems &amp; SaaS MVPs</text>

  <!-- slowly rotating orbit accent -->
  <g>
    <ellipse cx="600" cy="168" rx="330" ry="86" fill="none" stroke="#24282E" stroke-width="1"/>
    <ellipse cx="600" cy="168" rx="330" ry="86" fill="none" stroke="#64E6D3" stroke-width="1.4" stroke-dasharray="4 26" stroke-opacity="0.55">
      <animateTransform attributeName="transform" type="rotate" from="0 600 168" to="360 600 168" dur="22s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  </g>
</svg>
